steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/chatcord-backend', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/chatcord-backend']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - chatcord-backend
      - --image=gcr.io/$PROJECT_ID/chatcord-backend
      - --region=asia-east2
      - --platform=managed
      - --set-env-vars=REDIS_URL=${_REDIS_URL},MESSAGE_HISTORY_COUNT=${_MESSAGE_HISTORY_COUNT},REDIS_HOST=${_REDIS_HOST},REDIS_PORT=${_REDIS_PORT}
      - --set-secrets=FIREBASE_SERVICE_ACCOUNT_JSON=firebase-sa:latest
      - --allow-unauthenticated
      - --quiet

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY